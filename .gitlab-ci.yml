stages:
  - test
  - release

variables:
  INTEGRATION_TESTS: "false"

include:
  - project: 'b2connect/b2connect/devops/cicd'
    ref: master
    file: 'godefault/.tests.yml'
  - project: 'b2connect/b2connect/devops/cicd'
    ref: master
    file: 'godefault/.release.yml'

# johncena:24.0.9.0 (godefault default) ships Go 1.22.4 which cannot process
# a go 1.24 module (go tool cover fails with GOTOOLCHAIN=local). Pin coverage
# and lint to 24.0.9.2 (Go 1.24.1) until godefault bumps to a compatible
# version. Without this, golangci-lint's buildir fails to load export data
# for golang.org/x/sync/errgroup (go.mod requires go 1.24, image ships 1.22.4).
coverage:
  image: registry.gitlab.b2broker.tech/highload/b2connect/libs/docker/dockerfiles/johncena:24.0.9.2

lint:
  image: registry.gitlab.b2broker.tech/highload/b2connect/libs/docker/dockerfiles/johncena:24.0.9.2
