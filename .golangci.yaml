version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: false

linters:
  default: none
  enable:
    - gocyclo
    - goconst
    - gosec
    - revive
    - unused
    - unconvert
    - unparam
    - misspell
    - nakedret
    - prealloc
    - govet
    - staticcheck
  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 50 # TODO B2CT-19468: legacy migration concession; lower to 30 after refactor
    misspell:
      locale: US
    nakedret:
      max-func-lines: 40
  exclusions:
    rules:
      - linters:
          - revive
        text: "indent-error-flow"
      - linters:
          - revive
        text: "unused-parameter"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

issues:
  max-same-issues: 15
  max-issues-per-linter: 15
